name: publish-nuget

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # CR-1 RH-02：打包前校验 tag 与 csproj 版本一致——不一致即拒绝发布。
      # 原先缺这一步且允许 workflow_dispatch：推 v0.6.2 而 csproj 仍是 0.6.1 时，
      # pack 出的包版本号是 0.6.1，push 遇 --skip-duplicate 静默成功 ⇒ 主仓升 0.6.2 会
      # NU1101 失败，或误以为已发布而继续引用旧版。现已移除 workflow_dispatch（只允许 tag 触发）。
      - name: Validate tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/ScpiInstrument/ScpiInstrument.csproj)
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v${TAG} 与 csproj 版本 ${VER} 不一致，拒绝发布"
            exit 1
          fi

      - name: Restore
        run: dotnet restore ScpiInstrument.sln

      - name: Build
        run: dotnet build ScpiInstrument.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ScpiInstrument.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: dotnet pack src/ScpiInstrument/ScpiInstrument.csproj --configuration Release --no-build --output ./artifacts

      - name: Push to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/donkilove/index.json" \
            --api-key "$NUGET_AUTH_TOKEN" \
            --skip-duplicate
